<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impulse</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
        background: #12141a;
        color: #c8cdd8;
        font-family: system-ui, sans-serif;
      }
      #palette {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .item {
        padding: 8px 16px;
        border: 1px solid #3a3f4b;
        border-radius: 6px;
        background: #1c1f27;
        cursor: grab;
        user-select: none;
      }
      canvas {
        background: #1a1d25;
        border: 1px solid #3a3f4b;
      }
    </style>
  </head>
  <body>
    <div id="palette">
      <span>Drag onto the canvas:</span>
      <div class="item" draggable="true" data-shape="circle">Circle</div>
      <div class="item" draggable="true" data-shape="box">Box</div>
    </div>
    <canvas id="view" width="900" height="600"></canvas>
    <small>Red dots are contact points, red lines are contact normals.</small>
    <script type="module" src="./src/demo/main.ts"></script>
  </body>
</html>
